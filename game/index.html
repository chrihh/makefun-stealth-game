<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Ledger — a stealth burglary</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090d; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 1280px);
    aspect-ratio: 960 / 682;
    max-height: 100vh;
    display: block;
    touch-action: none;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Night Ledger: sneak past the wardens, lift the keycard on each floor and reach the exit stair unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
